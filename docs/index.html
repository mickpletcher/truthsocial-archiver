<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' archive:; img-src 'self' data: https:; media-src https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Truth Social Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Truth Social Archive</h1>
        <div class="run-status" id="runStatus">Archive status unavailable.</div>
      </div>
      <div class="downloads">
        <a href="data/archive-summary.json" data-web-only>Summary</a>
        <a href="data/posts.jsonl" data-web-only>JSONL</a>
        <button id="refreshArchive" type="button" hidden>Check for updates</button>
        <button id="openArchiveFolder" type="button" hidden>Open archive folder</button>
      </div>
    </header>

    <div class="desktop-status" id="desktopStatus" hidden></div>

    <section class="controls" aria-label="Search filters">
      <label>
        Search
        <input id="search" type="search" placeholder="Search posts">
      </label>

      <label>
        Profile
        <select id="profile">
          <option value="">All profiles</option>
        </select>
      </label>

      <label>
        Start date
        <input id="startDate" type="date">
      </label>

      <label>
        End date
        <input id="endDate" type="date">
      </label>
    </section>

    <div class="summary" id="summary">Loading archive...</div>
    <div class="load-more" id="loadMoreContainer" hidden>
      <button id="loadMoreButton" type="button" aria-controls="results">Load more</button>
    </div>
    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
