name: Scrape Truth Social Profiles

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run scraper
        shell: pwsh
        run: .\scripts\Scrape-TruthSocialProfiles.ps1

      - name: Fail on scrape errors
        shell: pwsh
        run: |
          $summaryPath = 'docs/data/archive-summary.json'

          if (-not (Test-Path -LiteralPath $summaryPath)) {
            Write-Error "Scraper did not write $summaryPath."
            exit 1
          }

          $summary = Get-Content -Raw -LiteralPath $summaryPath | ConvertFrom-Json

          if ($summary.status -eq 'error') {
            $failedProfiles = @(
              $summary.profiles |
                Where-Object { $_.status -eq 'error' } |
                ForEach-Object { $_.input }
            ) -join ', '

            Write-Error "Scraper reported an error for: $failedProfiles. See $summaryPath for details."
            exit 1
          }

          if ($summary.status -ne 'ok') {
            Write-Error "Scraper reported unexpected status '$($summary.status)' in $summaryPath."
            exit 1
          }

      - name: Commit archive updates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data

          if (-not (git diff --cached --quiet)) {
            git commit -m "Update Truth Social archive data"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push
          }
          else {
            Write-Host "No archive data changes to commit."
          }
