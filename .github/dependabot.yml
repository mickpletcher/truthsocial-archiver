version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      electron-toolchain:
        patterns:
          - '@electron-forge/*'
          - electron
          - playwright
      code-quality:
        patterns:
          - '@eslint/*'
          - eslint
          - globals
          - markdownlint-cli2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - '*'
